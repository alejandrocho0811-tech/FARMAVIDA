<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmaVida — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-topbar">
        <button id="btn-dark-mode-login" type="button" class="btn-dark-mode" onclick="toggleDarkModeLogin()">🌙</button>
    </div>

    <div class="login-container">
        <h1>FarmaVida</h1>
        <p>Ingresa tus credenciales para continuar</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <div class="password-input-wrap">
                <input id="login-password" type="password" name="contraseña" placeholder="Contraseña" required>
                <button id="btn-toggle-password" type="button" class="btn-password-toggle" onclick="toggleLoginPassword()" aria-label="Mostrar u ocultar contraseña"><svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path></svg></button>
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
        function actualizarTextoBotonTemaLogin() {
            const btn = document.getElementById('btn-dark-mode-login');
            if (!btn) return;
            const esOscuro = document.body.classList.contains('dark-mode');
            btn.textContent = esOscuro ? '☀️' : '🌙';
        }

        function inicializarTemaLogin() {
            const temaGuardado = localStorage.getItem('farmavida_tema');
            if (temaGuardado === 'dark') {
                document.body.classList.add('dark-mode');
            }
            actualizarTextoBotonTemaLogin();
        }

        function toggleDarkModeLogin() {
            document.body.classList.toggle('dark-mode');
            const esOscuro = document.body.classList.contains('dark-mode');
            localStorage.setItem('farmavida_tema', esOscuro ? 'dark' : 'light');
            actualizarTextoBotonTemaLogin();
        }

        function toggleLoginPassword() {
            const input = document.getElementById('login-password');
            const btn = document.getElementById('btn-toggle-password');
            if (!input || !btn) return;
            const mostrar = input.type === 'password';
            input.type = mostrar ? 'text' : 'password';
            document.getElementById('icon-eye-open').style.display = mostrar ? 'none' : 'block';
            document.getElementById('icon-eye-closed').style.display = mostrar ? 'block' : 'none';
            btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
        }

        document.addEventListener('DOMContentLoaded', inicializarTemaLogin);
    </script>
</body>
</html>
